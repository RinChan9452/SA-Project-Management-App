spring.application.name=projectsa

# --- Database: local H2 file in ./data (this IS the demo data; committed to Git with ./uploads, delete both to reset) ---
spring.datasource.url=jdbc:h2:file:./data/projectsa;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- File uploads (CLAUDE.md §8): 50 MB per file, 110 MB per upload in total (UC02's two PDFs fit).
#     error/413.html, WebExceptionHandler and the UC06 form state these numbers: change them together. ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=110MB
# Read the whole too-large upload so the user gets a message instead of a dropped connection
server.tomcat.max-swallow-size=-1
app.upload-dir=./uploads

# --- Error responses: no stack traces or exception messages (DevTools turns both on by default).
#     Boot 4 key; the old server.error.* keys are ignored. ---
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# --- Misc ---
spring.thymeleaf.cache=false
server.servlet.session.timeout=60m
