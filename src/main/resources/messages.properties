# Messages shown when a submitted value cannot be converted to the field's type
# (e.g. letters in a number field, or a tampered dropdown). Bean Validation messages stay in the form classes.
# Lookup order: typeMismatch.<field>, then typeMismatch.<java type>, then typeMismatch.
# Do not use apostrophes here (MessageFormat treats ' as a quote character).
typeMismatch=Invalid value
typeMismatch.java.lang.Long=Please choose a valid option
typeMismatch.java.math.BigDecimal=Please enter a number
typeMismatch.java.time.LocalDate=Please enter a valid date
typeMismatch.java.time.LocalDateTime=Please enter a valid date and time

typeMismatch.role=Please choose a role
typeMismatch.saleId=Please choose the Sale in charge
typeMismatch.presaleId=Please choose the Presale Engineer in charge
typeMismatch.estBudget=Estimated budget must be a number
typeMismatch.testAt=Please enter a valid test date and time
typeMismatch.priority=Please choose a priority
typeMismatch.dueDate=Please enter a valid due date
typeMismatch.decision=Please choose Approve or Reject
