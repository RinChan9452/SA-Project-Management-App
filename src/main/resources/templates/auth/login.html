<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body class="auth-page">
<main class="container">
    <div class="card auth-card shadow-sm mx-auto">
        <div class="card-body p-4">
            <h1 class="h4 mb-1"><i class="bi bi-kanban text-primary"></i> Project Management Program</h1>
            <p class="text-muted mb-4">Log in to continue</p>

            <div th:if="${param.registered}" class="alert alert-success">Registration successful. Please log in.</div>
            <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
            <div th:if="${param.error}" class="alert alert-danger">Incorrect email or password.</div>

            <form th:action="@{/login}" method="post" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required autofocus
                           autocomplete="username">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required
                           autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>

            <p class="text-center mt-4 mb-0">
                No account yet? <a th:href="@{/register}">Register</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
