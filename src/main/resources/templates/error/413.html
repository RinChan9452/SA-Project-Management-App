<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('File too large')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="card shadow-sm mx-auto" style="max-width: 560px">
        <div class="card-body p-4 text-center">
            <i class="bi bi-file-earmark-x text-danger display-5"></i>
            <h1 class="h4 mt-2">File too large</h1>
            <p class="text-muted">Each file can be at most 50 MB, and all files sent together at most 110 MB.
                Please go back and choose smaller or fewer files.</p>
            <a href="javascript:history.back()" class="btn btn-primary">Go back</a>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Dashboard</a>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
